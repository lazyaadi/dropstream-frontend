[build]
  command = "npm install && npm run build"
  publish = "dist"

[context.production.environment]
  NODE_ENV = "production"

[[redirects]]
  # Allow Netlify Functions to be served directly (avoid SPA rewrite)
  from = "/.netlify/functions/*"
  to = "/:splat"
  status = 200
  force = true

[[redirects]]
  # If you have server API routes under /api, let them pass through
  from = "/api/*"
  to = "/api/:splat"
  status = 200
  force = false

[[redirects]]
  # SPA fallback for everything else (must be last)
  from = "/*"
  to = "/index.html"
  status = 200
